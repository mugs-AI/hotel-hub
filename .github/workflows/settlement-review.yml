name: Settlement review SQL

on:
  push:
    branches: [review/hh-n3-billing-20261008]
    paths:
      - .github/workflows/settlement-review.yml
      - db/checks/hh-settlement-*
      - supabase/migrations/20261008080000_hh_billing_settlement.sql

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: hh_settlement_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d hh_settlement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HH_TEST_PG_URL: postgresql://postgres:synthetic_test_only@127.0.0.1:5432/hh_settlement_test
      HH_SQL_TEST_TOOLS: .superpowers/sdd/2026-10-08-n3-billing-settlement/pg-client
    steps:
      - name: Check out exact review commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated SQL test client
        run: npm install --prefix "$HH_SQL_TEST_TOOLS" --no-package-lock --ignore-scripts pg@8.16.3
      - name: Compile candidate and execute single-session checks
        run: node db/checks/hh-settlement-postgres-setup.mjs
      - name: Execute independent backend races
        run: node db/checks/hh-settlement-multisession.mjs
